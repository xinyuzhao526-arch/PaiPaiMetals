name: probe models endpoint

# 一次性自检：在 Actions 里用真实凭据打一次 GitHub Models，结果写回仓库，供外部读取。
on:
  push:
    paths:
      - '.github/workflows/probe-models.yml'
      - 'scripts/probe_models.py'
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe model channel
        env:
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
        run: python3 scripts/probe_models.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/models_probe.json || true
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "chore(probe): 模型通道自检结果"
            git push
          fi
