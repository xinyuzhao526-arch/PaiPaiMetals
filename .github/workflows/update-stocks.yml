name: Update stocks & supply events

# 公开数据自动刷新（每交易日 08:30 北京时间 run 一次，可用 Actions 手动触发）
#   1) 交易所库存：LME 经 westmetall 公开镜像 + SHFE 官网每日仓单  -> data/stocks.json
#      同时把当日点并入 data/stocks_history.json（库存折线的数据源，追加去重）
#   2) 供给事件池：公开 RSS 源（mining-technology / northernminer / australianmining /
#                  im-mining / mining.com）标题级抓取，按品种关键词归类 -> data/events.json
#                 新条目经两层漏斗（品种归类 + 事件类型白名单，见 scripts/fetch_events.py）
#                 过滤后入库：status=auto / src_level=media，页面显示蓝底「自动发布」，
#                 无需人工逐条确认；已回溯一手来源的条目为 status=ok（页面「已核验」）。
#   3) 中文编译：新增条目由 scripts/translate_events.py 生成 title_zh / summary_zh
#                 需要一把外部大模型 key（OpenAI 兼容接口），配置为仓库 Secret TRANSLATE_API_KEY，
#                 并用仓库 Variables 指定 TRANSLATE_API_BASE / TRANSLATE_MODEL。
#                 注意：GitHub 自带的 Models 接口（models.github.ai）已不再返回补全，
#                 仅回 200 + "OK"，不可再用作翻译通道。
#                 缺 key 或缺通道时页面显示英文并标「待译」，不阻断其余流程。
#
# 改关键词后务必跑回归：python3 scripts/test_screen.py
# 未覆盖：GFEX / DCE 官网对自动化请求有反爬（JS 挑战 / HTTP 412），锂与铁的交易所仓单
#         目前为页面内的核验基线，不参与自动刷新。
# 合规：仅抓取公开页面与公开 RSS；不抓取任何会员制 / 付费内容。
on:
  schedule:
    - cron: '30 0 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write
  models: read   # 若使用 GitHub Models 作为翻译通道

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch LME / SHFE stocks
        run: python3 scripts/fetch_stocks.py --out data/stocks.json

      - name: Fetch supply events (best effort)
        run: python3 scripts/fetch_events.py --out data/events.json
        continue-on-error: true

      - name: Translate new events to Chinese (best effort)
        continue-on-error: true
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_API_BASE: ${{ vars.TRANSLATE_API_BASE }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/translate_events.py --in data/events.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 分文件 add：任一文件缺失（例如事件抓取首次失败还未生成）都不影响另一个被提交
          git add data/stocks.json || true
          git add data/stocks_history.json || true
          git add data/events.json || true
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore(data): 自动更新交易所库存 / 供给事件池 $(date -u +%F)"
            git push
          fi
