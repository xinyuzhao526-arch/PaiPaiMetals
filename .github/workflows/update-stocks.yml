name: Update exchange stocks

# 交易所公开库存自动刷新（北京 08:30 ≈ UTC 00:30，周二至周六 UTC）
on:
  schedule:
    - cron: '30 0 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stocks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch LME / SHFE stocks
        run: python3 scripts/fetch_stocks.py --out data/stocks.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          if git diff --staged --quiet; then
            echo "库存无变化，跳过提交"
          else
            git commit -m "chore(stocks): 自动更新交易所库存 $(date -u +%F)"
            git push
          fi
